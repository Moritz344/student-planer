<app-topbar></app-topbar>
<app-leftbar></app-leftbar>

@if (settings.view() == "home") {
  <app-homework></app-homework>

}@else if (settings.view() == "timetable") {
  <app-timetable></app-timetable>
} @else if (settings.view() == "exams") {
  <app-exams></app-exams>
} @else if (settings.view() == "grades") {
  <app-grades></app-grades>
}


@if (settings.showAbout()) {
  <app-about-dialog (close)="settings.showAbout.set(false)"></app-about-dialog>
}

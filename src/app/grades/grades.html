<div class="container">
  <div class="average-container">
    <button>{{ settings.averageGrade() }}</button>
  </div>
  <button class="new-grade" (click)="onNewGrade()">Note Eintragen</button>
  <div class="grades-container">
    @for (s of settings.subjectData(); track $index) {
      <div class="grade-item">
        <img class="item-icon"
        [class.green]="s.color == 'green'"
        [class.blue]="s.color == 'blue'"
        [class.yellow]="s.color == 'yellow'"
        [class.gray]="s.color == 'gray'"
        [class.red]="s.color == 'red'"
        src="dot.svg" >
        <span>{{ s.name }}</span>
        <span class="grade">
        @for (g of settings.gradesData(); track $index) {
          @if (s.id == g.fk_subject) {
            <span>{{ g.grade }}</span>
          }
        }
        </span>
      </div>
    }
  </div>
</div>
